services:
  neo4j:
    image: neo4j:5.26-community
    container_name: graphwright-neo4j
    ports:
      - "127.0.0.1:7474:7474"   # Neo4j Browser UI
      - "127.0.0.1:7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/graphwright
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p graphwright 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  graphwright:
    build: .
    container_name: graphwright-mcp
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graphwright
      NEO4J_DATABASE: neo4j
      MCP_HOST: 0.0.0.0          # container-internal; the published port stays loopback
      MCP_PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"   # loopback only: this server has no auth
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 8000), 2)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  neo4j-data:
