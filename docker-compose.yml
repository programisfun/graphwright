services:
  neo4j:
    image: neo4j:5.26-community
    container_name: graphwright-neo4j
    ports:
      - "127.0.0.1:7474:7474"   # Neo4j Browser UI
      - "127.0.0.1:7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/graphwright
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p graphwright 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

volumes:
  neo4j-data:
