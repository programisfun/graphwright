services:
  # Neo4j is external now (Neo4j AuraDB); credentials and URI come from .env.
  # For a local Neo4j instead, restore the neo4j service from git history
  # (commit 702e1a8) and set NEO4J_URI=bolt://neo4j:7687 in .env.
  graphwright:
    build: .
    container_name: graphwright-mcp
    env_file:
      - path: .env
        required: false
    environment:
      MCP_HOST: 0.0.0.0              # container-internal; the published port stays loopback
      MCP_PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"   # loopback only: this server has no auth unless MCP_AUTH_TOKEN is set
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 8000), 2)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
