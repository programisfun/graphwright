# Cloudflare Worker that keeps Render and AuraDB awake.
#
#   npx wrangler login
#   npx wrangler secret put MCP_AUTH_TOKEN
#   npx wrangler deploy
#
# No card required on the Workers free plan (100k requests/day; this uses ~1.4k).

name = "graphwright-warm"
main = "warm.js"
compatibility_date = "2026-11-17"

[triggers]
crons = ["*/10 * * * *"]

[vars]
WARM_URL = "https://graphwright-kjn8.onrender.com"
# Local hour = UTC + TZ_OFFSET_HOURS (e.g. 8 for Asia/Singapore, -5 for US Eastern)
TZ_OFFSET_HOURS = "8"
# Only ping inside this local window; 15 h/day ≈ 450 of Render's 750 monthly hours.
START_HOUR = "8"
END_HOUR = "23"
